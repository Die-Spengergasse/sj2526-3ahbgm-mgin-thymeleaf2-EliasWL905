<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Auto Liste</title>
    <link rel="stylesheet" th:href="@{/design.css}">
</head>
<body>
<div class="container">
    <h2>Autohaus – Fahrzeugliste</h2>
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
        <tr>
            <th>Modellname</th>
            <th>Hersteller</th>
            <th>Baujahr</th>
            <th>Farbe</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="auto : ${Autos}">
            <td th:text="${auto.modellname}"></td>
            <td th:text="${auto.hersteller}"></td>
            <td th:text="${auto.baujahr}"></td>
            <td th:text="${auto.farbe}"></td>
            <td>
                <a th:href="@{/autohausmanager/edit(id=${auto.id})}" class="btn btn-primary">Bearbeiten</a>
                <a th:href="@{/autohausmanager/delete(id=${auto.id})}" class="btn btn-danger" onclick="return confirm('Fahrzeug wirklich löschen?')">Löschen</a>
            </td>
        </tr>


        </tbody>
    </table>

    <a href="/autohausmanager/add" class="btn btn-primary">Neues Auto hinzufügen</a>
    <a href="/" class="btn btn-default">Zurück zur Startseite</a>
</div>
</body>
</html>
